<!--
  Favicon do site: a aranha do `SpiderIcon`, hoje em `_arquivo/spider-icon.jsx`.

  O Next serve qualquer `icon.(svg|png|ico)` dentro de `app/` como <link rel="icon">
  automaticamente. O `favicon.ico` do create-next-app SAIU daqui em 24/08 (está em
  `_arquivo/favicon-create-next-app.ico`): enquanto ele existisse, ganharia deste
  arquivo na rota /favicon.ico.

  ⚠️ NUNCA ESCREVA DOIS HÍFENS SEGUIDOS NESTE COMENTÁRIO. Comentário XML não pode
  conter essa sequência: o arquivo vira SVG malformado e o navegador simplesmente
  não desenha o ícone. Aconteceu aqui em 24/08 com uma tabela markdown cujos
  separadores tinham três hífens. O `next build` passou verde e o eslint também,
  porque nenhum dos dois abre o arquivo. Só se vê carregando a imagem.

  ⚠️ ESTE DESENHO É UMA VARIANTE, NÃO UMA CÓPIA de `SpiderIcon` em `art.jsx`.
  As pernas são as mesmas oito curvas; o que muda, e por quê:

    · traço 4,5 → 7. A 4,5 o traço daria 0,7px num favicon de 16px.
    · cabeça de cy 35 r 6 → cy 32 r 6,5. Subiu para descolar do corpo.
    · corpo de ry 14 → ry 13. Com traço grosso, corpo cheio vira mancha.
    · escala 0,8. As pernas vão até x=8 e y=95; em tamanho cheio elas encostam
      na borda do quadrado.

  Os três primeiros números saíram de comparar variantes na tela, ampliadas: com
  traço 10 e corpo gordo (a primeira tentativa), cabeça e corpo FUNDEM numa massa
  só e o desenho lê como estrela-do-mar, não como aranha. É o inverso da intuição
  — engordar para caber em 16px estraga a silhueta antes de ajudar.

  Mexeu num, olhe o outro. São dois desenhos irmãos, não um só em dois lugares.

  O fundo é `blood-400` (#e01b2c) e não o `blood-800` do botão de voltar ao topo:
  a 16px, vermelho escuro sobre barra de aba escura vira um borrão sem forma.
  Aqui o que manda é contraste, não harmonia com o resto da página.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="22" fill="#e01b2c" />
  <g transform="translate(50 53) scale(0.8) translate(-50 -53)">
    <g fill="none" stroke="#f1ede6" stroke-width="7" stroke-linecap="round">
      <g>
        <path d="M44 41C31 36 23 24 21 11" />
        <path d="M42 49C26 47 14 41 8 31" />
        <path d="M42 57C26 61 14 69 10 79" />
        <path d="M45 64C35 73 29 84 28 95" />
      </g>
      <g transform="translate(100 0) scale(-1 1)">
        <path d="M44 41C31 36 23 24 21 11" />
        <path d="M42 49C26 47 14 41 8 31" />
        <path d="M42 57C26 61 14 69 10 79" />
        <path d="M45 64C35 73 29 84 28 95" />
      </g>
    </g>
    <ellipse cx="50" cy="54" rx="7.5" ry="13" fill="#f1ede6" />
    <circle cx="50" cy="32" r="6.5" fill="#f1ede6" />
  </g>
</svg>
